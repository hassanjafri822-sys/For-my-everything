<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="opening-screen" id="openingScreen">

        <div class="city-background"></div>
        <div class="fog"></div>
        <div class="vignette"></div>

        <canvas id="rainCanvas"></canvas>

        <div class="opening-content">

            <span class="small-text">SOME WORDS ARE WORTH THE WAIT</span>

            <h1>
                A little something<br>
                for you.
            </h1>

            <p>
                Take a moment. There's something I'd like to say.
            </p>

            <button id="startButton">
                Please forgive me?
            </button>

        </div>

        <div class="bottom-text">
            A LETTER FROM THE HEART
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
